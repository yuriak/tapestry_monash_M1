[project]
name = "tapestry-m1"
version = "0.1.0"
description = "Sovereign Evidence Assistant: modular medicine and law research stack"
requires-python = ">=3.11,<3.12"
dependencies = []

# This is a source checkout, not an installable distribution.
[dependency-groups]
dev = ["pytest==8.4.2"]
model-runtime = ["numpy==2.2.6", "torch==2.6.0", "transformers==4.51.3", "huggingface-hub==0.35.3", "safetensors==0.5.3"]
retrieval = [{include-group = "model-runtime"}]
reranker = [
    {include-group = "model-runtime"},
    "accelerate==1.6.0",
    "peft==0.15.2",
]

[tool.uv]
package = false
python-preference = "only-managed"
default-groups = ["dev", "retrieval", "reranker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
